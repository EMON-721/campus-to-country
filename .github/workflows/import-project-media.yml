name: Import remaining verified project media
on:
  push:
    branches: [main]
    paths: [deployment/import-media-20261016.json]
permissions:
  contents: write
concurrency:
  group: campus-to-country-media-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'EMON-721/campus-to-country'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and verify original public media
        run: python3 scripts/import-original-media.py
      - name: Commit verified media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/
          if ! git diff --cached --quiet; then
            git commit -m "Complete original project media import with verified blob hashes"
            git push origin HEAD:main
          fi

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react-types:
        patterns:
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      # Next lint plugins do not yet support ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Compiler API migration requires a dedicated upgrade of the test harness.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep declarations aligned with the supported Node runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
